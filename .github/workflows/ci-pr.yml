# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI PR

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "renovate/**"

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            max-jobs = auto
            cores = 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Format check
        run: |
          nix shell nixpkgs#nixfmt --command \
            find . -name "*.nix" -not -path "./.git/*" -not -name "result" \
            -exec nixfmt --check {} +

      - name: Flake check
        run: nix flake check --no-build

      - name: Deadnix
        run: nix shell nixpkgs#deadnix --command deadnix --exclude result

      - name: Statix
        run: nix shell nixpkgs#statix --command statix check
